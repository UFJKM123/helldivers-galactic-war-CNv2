<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>绝地潜兵同人游戏（v1.0）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft Yahei}
body{background:#050512;color:#eee;display:flex;height:100vh;overflow:hidden}
#canvasWrap{flex:1}
canvas{background:#03030a;display:block}
#uiPanel{width:340px;background:#101226;padding:14px;border-left:#333a70 solid 2px;display:flex;flex-direction:column}
#uiContent{flex:1;overflow:auto}
#signature{font-size:10px;color:#555;text-align:right;margin-top:8px;padding-top:8px;border-top:1px solid #333a70}
h3{color:#80b8ff;margin-bottom:8px;font-size:16px}
.info-line{margin:5px 0;font-size:13px}
.diff-row{display:flex;gap:6px;align-items:center;margin:5px 0}
.diff-row select{flex:1;padding:5px}
.diff-row button{width:auto;padding:6px 10px;font-size:12px}
hr{margin:8px 0;border-color:#333866}
button{width:100%;padding:8px;margin:4px 0;border:none;border-radius:4px;cursor:pointer;font-weight:bold;font-size:13px}
.btn-turn{background:#278833;color:#fff}
.btn-weapon{background:#244699;color:#fff}
.btn-endgame{background:#912828;color:#fff}
.btn-deploy{background:#b8860b;color:#fff}
select{width:100%;padding:5px;margin:4px 0;font-size:13px}
.tips{font-size:11px;color:#aaa;line-height:1.5;margin-top:6px}
.modal{
    position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);
    display:none;align-items:center;justify-content:center;z-index:100;
}
.modal-box{
    background:#121430;border:2px solid #ffdd44;padding:30px;min-width:420px;max-width:500px;text-align:center
}
.modal-box h2{color:#ffdd44;margin-bottom:12px}
.modal-box p{color:#ddd;font-size:15px;margin:8px 0;line-height:1.5}
.modal-box button{margin-top:16px;width:120px;padding:8px;background:#278833;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold}
.score-text{margin:10px 0;font-size:16px}
.send-selector{display:flex;align-items:center;gap:10px;margin:6px 0}
.send-selector label{font-size:13px;color:#aaa}
.send-selector select{flex:1;padding:5px}
</style>
</head>
<body>
<div id="canvasWrap">
    <canvas id="starCanvas"></canvas>
</div>
<div id="uiPanel">
    <div id="uiContent">
        <h3>绝地潜兵同人游戏（v1.0）</h3>
        <div class="info-line">选择操控阵营：</div>
        <select id="campSelect">
            <option value="EARTH">超级地球｜母星：超级地球【蓝】</option>
            <option value="TERM">终结族｜母星：佛里主星【黄】</option>
            <option value="LIGHT">光能者｜母星：西斯【紫】</option>
            <option value="ROBOT">机器人｜母星：生化斯坦【红】</option>
        </select>
        <div class="diff-row">
            <select id="difficultySelect" style="width:60%;font-size:12px">
                <option value="easy">简单</option>
                <option value="normal" selected>一般</option>
                <option value="hard">困难</option>
            </select>
            <button id="randomStrengthBtn" class="btn-deploy" style="margin:0">🎲 随机强度</button>
        </div>
        <div class="info-line" id="strengthDisplay" style="font-size:11px;color:#ffcc88">各阵营强度：未分配</div>
        <button onclick="restartGame()">重新开局</button>
        <hr>
        <div class="info-line">回合：<span id="turnNum">1</span></div>
        <div class="info-line">选中对象：<span id="selText">无</span></div>
        <div class="info-line">星球名称：<span id="selPlanetName">-</span></div>
        <div class="send-selector">
            <label for="sendRatioSelect">派兵比例：</label>
            <select id="sendRatioSelect">
                <option value="0.5">50% 兵力</option>
                <option value="1.0">全部兵力</option>
            </select>
        </div>
        <hr>
        <div class="info-line"><b>军备指令</b></div>
        <button class="btn-weapon" id="buildWeaponBtn">建造/部署大型武器</button>
        <button class="btn-deploy" id="moveWeaponBtn" disabled>移动武器 (选中移动型武器)</button>
        <button class="btn-endgame" id="buildFIN">启动终结手段【威慑胜利】</button>
        <div class="info-line" id="weaponStatus">武器状态：无</div>
        <div class="info-line" id="deterrenceStatus" style="display:none;color:#ffaa44"></div>
        <hr>
        <button class="btn-deploy" id="strategicDrawBtn">✨ 战略机遇 (等待中)</button>
        <div class="tips" id="drawInfo" style="font-size:11px;color:#aaa">消耗30兵力，每10回合可发动一次</div>
        <hr>
        <button class="btn-turn" id="nextTurnBtn">结束回合</button>
        <div class="tips" id="tipsPanel"></div>
    </div>
    <div id="signature">作者：Anklian和NoneTypes以及传奇的Deepseek和豆包</div>
</div>

<!-- 结算弹窗 -->
<div class="modal" id="resultModal">
    <div class="modal-box">
        <h2 id="winTitle">对局结束</h2>
        <div class="score-text" id="resultType"></div>
        <div class="score-text" id="campVictoryMessage"></div>
        <div class="score-text">最终控制星球：<span id="statPlanet">0</span></div>
        <div class="score-text">累计消灭敌军兵力：<span id="statKills">0</span></div>
        <div class="score-text">存活回合：<span id="statTurn">0</span></div>
        <div class="score-text"><b>本局综合评分：<span id="finalScore">0</span></b></div>
        <br>
        <button onclick="closeModal();restartGame()">再来一局</button>
    </div>
</div>

<!-- 通用剧情弹窗 -->
<div class="modal" id="eventModal">
    <div class="modal-box">
        <h2 id="eventTitle">事件</h2>
        <p id="eventMessage"></p>
        <button onclick="closeEventModal()">确定</button>
    </div>
</div>

let canvas,ctx;
let planets=[], links=[], blockedLinks=new Set();
let playerCampKey="EARTH", difficulty="normal";
let turn=1, selectedPlanet=null, selectedWeapon=null, deployMode=null, weapons=[], statKills=0, lastDrawTurn=0;
let aiStrengthFactors={}, deterrenceActive=false, deterrenceTurnsLeft=0;
let eliminationsTriggered=new Set(), maiaRiverTriggered=false, lastWeakCamp=null;

let turnDom, selDom, weaponDom, selPlanetNameDom;
let resultModal, eventModal;
let sendRatioSelect, difficultySelect;
let buildWeaponBtn, moveWeaponBtn, tipsPanel;
let deterrenceStatusDom, strategicDrawBtn;

window.onload = init;
window.addEventListener("resize", resizeCanvas);

function init(){
    canvas = document.getElementById("starCanvas");
    ctx = canvas.getContext("2d");
    turnDom = document.getElementById("turnNum");
    selDom = document.getElementById("selText");
    selPlanetNameDom = document.getElementById("selPlanetName");
    weaponDom = document.getElementById("weaponStatus");
    deterrenceStatusDom = document.getElementById("deterrenceStatus");
    resultModal = document.getElementById("resultModal");
    eventModal = document.getElementById("eventModal");
    sendRatioSelect = document.getElementById("sendRatioSelect");
    difficultySelect = document.getElementById("difficultySelect");
    buildWeaponBtn = document.getElementById("buildWeaponBtn");
    moveWeaponBtn = document.getElementById("moveWeaponBtn");
    tipsPanel = document.getElementById("tipsPanel");
    strategicDrawBtn = document.getElementById("strategicDrawBtn");

    buildWeaponBtn.onclick = onBuildWeapon;
    moveWeaponBtn.onclick = onMoveWeapon;
    document.getElementById("buildFIN").onclick = activateFinal;
    document.getElementById("nextTurnBtn").onclick = nextTurn;
    document.getElementById("randomStrengthBtn").onclick = randomizeEnemyStrength;
    canvas.onclick = canvasClick;
    strategicDrawBtn.onclick = performStrategicDraw;

    resizeCanvas();
    restartGame();
    updateTips();
}

function resizeCanvas(){
    canvas.width = window.innerWidth - 340;
    canvas.height = window.innerHeight;
    if(planets.length>0) render();
}

function restartGame(){
    playerCampKey = document.getElementById("campSelect").value;
    difficulty = difficultySelect.value;
    turn = 1; lastDrawTurn = 0;
    selectedPlanet = null; selectedWeapon = null; deployMode = null;
    statKills = 0; blockedLinks.clear();
    planets = []; links = []; weapons = [];
    deterrenceActive = false; deterrenceTurnsLeft = 0;
    aiStrengthFactors = {};
    CAMP_KEYS.forEach(ck => { if(ck !== playerCampKey) aiStrengthFactors[ck]=0; });
    eliminationsTriggered.clear(); maiaRiverTriggered = false; lastWeakCamp = null;

    turnDom.textContent = turn;
    selDom.textContent = "无";
    selPlanetNameDom.textContent = "-";
    updateWeaponStatusUI();
    resultModal.style.display = "none";
    eventModal.style.display = "none";
    sendRatioSelect.value = "0.5";
    moveWeaponBtn.disabled = true;
    if(deterrenceStatusDom) deterrenceStatusDom.style.display = "none";
    updateDrawButton();
    generateGalaxy();
    updateTips();
    updateStrengthDisplay();
    render();
}

function getDifficultyParams(){
    switch(difficulty){
        case 'easy': return { neutMin:4, neutMax:14, aiThreshold:20, aiExtraGrowth:false };
        case 'hard': return { neutMin:12, neutMax:38, aiThreshold:5, aiExtraGrowth:true };
        default: return { neutMin:6, neutMax:22, aiThreshold:10, aiExtraGrowth:false };
    }
}

function generateGalaxy(){
    const W = canvas.width, H = canvas.height, pad = CONFIG.canvasPad;
    const homePos = [{x:pad,y:pad},{x:W-pad,y:pad},{x:pad,y:H-pad},{x:W-pad,y:H-pad}];
    CAMP_KEYS.forEach((ck,idx)=>{
        planets.push({x:homePos[idx].x, y:homePos[idx].y, camp:ck, isHome:true, troop:CONFIG.homeInitTroop,
            planetName:CAMPS[ck].homeName, uid:Math.random().toString(36).slice(2,10), resource:false});
    });
    const earthHome = planets[0];
    planets.push({x:earthHome.x+80, y:earthHome.y+50, camp:"EARTH", isHome:false, troop:40,
        planetName:"麦拉芬蒙河", uid:Math.random().toString(36).slice(2,10), resource:false});
    const diff = getDifficultyParams();
    let namePool = [...PLANET_NAME_LIST].sort(()=>Math.random()-0.5);
    const totalNormal = CONFIG.planetTotal - 5;
    const resourceIndices = new Set();
    while(resourceIndices.size < CONFIG.resourceCount) resourceIndices.add(Math.floor(Math.random()*totalNormal));
    for(let i=0;i<totalNormal;i++){
        let x,y;
        do{ x=pad+Math.random()*(W-pad*2); y=pad+Math.random()*(H-pad*2);
        }while(planets.some(p=>Math.hypot(p.x-x,p.y-y)<40));
        const initT = Math.floor(Math.random()*(diff.neutMax-diff.neutMin))+diff.neutMin;
        let pname = namePool.length>0 ? namePool.shift() : "星球"+i;
        planets.push({x,y,camp:null,isHome:false,troop:initT,planetName:pname,
            uid:Math.random().toString(36).slice(2,10), resource:resourceIndices.has(i)});
    }
    buildConnections();
}

function buildConnections(){
    links = [];
    planets.forEach(p=>{
        const others = planets.filter(o=>o.uid!==p.uid).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y)).slice(0,5);
        others.forEach(t=>{
            const idPair = [p.uid,t.uid].sort().join("_");
            if(!links.some(l=>l.idPair===idPair)) links.push({a:p,b:t,idPair});
        });
    });
}

function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    links.forEach(ln=>{
        const isBlock = blockedLinks.has(ln.idPair);
        ctx.beginPath(); ctx.moveTo(ln.a.x,ln.a.y); ctx.lineTo(ln.b.x,ln.b.y);
        ctx.strokeStyle = isBlock ? "#772222":"#283060"; ctx.lineWidth = isBlock?2:1; ctx.stroke();
    });
    planets.forEach(p=>{
        const r = p.isHome?16:10;
        const campData = p.camp?CAMPS[p.camp]:null;
        if(selectedPlanet && selectedPlanet.uid===p.uid){
            ctx.beginPath(); ctx.arc(p.x,p.y,r+5,0,Math.PI*2);
            ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2);
        ctx.fillStyle = campData?campData.color:"#505050"; ctx.fill();
        if(p.isHome){
            ctx.beginPath(); ctx.arc(p.x,p.y,r+3,0,Math.PI*2);
            ctx.strokeStyle="#ffdd00"; ctx.lineWidth=2; ctx.stroke();
        }
        if(p.resource){
            ctx.fillStyle="#ffaa00"; ctx.font="12px Arial"; ctx.fillText("◆",p.x,p.y-r-2);
        }
        ctx.fillStyle="#fff"; ctx.font="bold 11px Arial"; ctx.textAlign="center";
        ctx.fillText(p.troop, p.x, p.y+r+13);
        ctx.fillStyle="#aaa"; ctx.font="8px Microsoft Yahei";
        ctx.fillText(p.planetName, p.x, p.y+r+22);
        const planetWeapons = weapons.filter(w=>w.planetId===p.uid);
        if(planetWeapons.length>0){
            let yOff = p.y - r - 8;
            planetWeapons.forEach(w=>{
                const wc = CAMPS[w.camp];
                ctx.fillStyle = wc?wc.color:"#fff"; ctx.font="16px Arial";
                ctx.fillText(w.type==='mobile'?'◈':'⬢', p.x, yOff);
                yOff -= 16;
            });
        }
    });
}

    });

function checkPowerBalance(){
    if(turn <= 2) return; // 开局几回合不判断
    const power={}; CAMP_KEYS.forEach(ck=>{
        const campPlanets = planets.filter(p=>p.camp===ck);
        power[ck] = campPlanets.reduce((sum,p)=>sum+p.troop,0);
    });
    const entries = Object.entries(power).filter(([_,v])=>v>0);
    if(entries.length<2) return;
    entries.sort((a,b)=>a[1]-b[1]);
    const weakest=entries[0], strongest=entries[entries.length-1];
    if(strongest[1]===0) return;
    const ratio = weakest[1]/strongest[1];
    if(ratio<0.25 && weakest[0]!==lastWeakCamp){
        lastWeakCamp = weakest[0];
        showEventModal("势力衰弱", `${CAMPS[weakest[0]].name}势力严重衰弱，恐怕难以支撑……`);
    }
}

// ==================== 抽卡 ====================
function updateDrawButton(){
    if(turn<10){ strategicDrawBtn.textContent=`✨ 战略机遇 (第10回合解锁)`; strategicDrawBtn.disabled=true; return; }
    const remaining = CONFIG.drawCooldown - (turn - lastDrawTurn);
    if(remaining<=0){ strategicDrawBtn.textContent=`✨ 战略机遇 (可用)`; strategicDrawBtn.disabled=false; }
    else{ strategicDrawBtn.textContent=`✨ 战略机遇 (冷却 ${remaining} 回合)`; strategicDrawBtn.disabled=true; }
}
function performStrategicDraw(){
    if(turn<10){ alert("前10回合无法使用战略机遇"); return; }
    if(turn - lastDrawTurn < CONFIG.drawCooldown){ alert(`冷却中，还需等待 ${CONFIG.drawCooldown-(turn-lastDrawTurn)} 回合`); return; }
    const myPlanets = planets.filter(p=>p.camp===playerCampKey && p.troop>=CONFIG.drawCost);
    if(myPlanets.length===0){ alert(`没有星球兵力达到${CONFIG.drawCost}，无法发动战略机遇`); return; }
    const payer = myPlanets[Math.floor(Math.random()*myPlanets.length)];
    payer.troop -= CONFIG.drawCost;
    const campEvents = STRATEGIC_EVENTS[playerCampKey];
    const isPositive = Math.random()<0.5;
    const pool = isPositive?campEvents.positive:campEvents.negative;
    const event = pool[Math.floor(Math.random()*pool.length)];
    const targetPlanet = planets.filter(p=>p.camp===playerCampKey)[Math.floor(Math.random()*planets.filter(p=>p.camp===playerCampKey).length)];
    if(!targetPlanet) return;
    const oldTroop = targetPlanet.troop;
    const effectAmt = isPositive? Math.floor(Math.random()*25)+25 : Math.floor(Math.random()*20)+5;
    if(isPositive) targetPlanet.troop += effectAmt;
    else targetPlanet.troop = Math.max(1, targetPlanet.troop - effectAmt);
    const newTroop = targetPlanet.troop;
    lastDrawTurn = turn; updateDrawButton();
    const finalDesc = event.desc.replace(/{planet}/g, targetPlanet.planetName);
    const change = isPositive? `+${effectAmt}` : `-${effectAmt}`;
    showEventModal(`战略机遇：${event.title} (${isPositive?'正面':'负面'})`,
        `${finalDesc}\n目标：${targetPlanet.planetName}\n兵力变化：${change}（当前：${newTroop}）`);
    render();
}

function nextTurn(){
    const diff = getDifficultyParams();
    weapons.forEach(w=>{ if(w.type==='deploy'&&w.decay>0){ const planet=planets.find(p=>p.uid===w.planetId); if(planet&&planet.camp!==w.camp) planet.troop=Math.max(1,planet.troop-w.decay); }});
    planets.forEach(p=>{ if(p.camp&&p.camp!==playerCampKey) aiAction(p, diff.aiThreshold, deterrenceActive?playerCampKey:null); });
    if(deterrenceActive){ const playerHome=planets.find(p=>p.isHome&&p.camp===playerCampKey); if(!playerHome){ endGame("defeat"); return; }}
    if(!deterrenceActive){ planets.forEach(p=>{ if(p.camp===playerCampKey) p.troop+=1; if(p.camp===playerCampKey&&p.resource) p.troop+=2; }); }
    planets.forEach(p=>{ if(p.camp&&p.camp!==playerCampKey) p.troop+=1; if(p.camp&&p.camp!==playerCampKey&&p.resource) p.troop+=2; });
    CAMP_KEYS.forEach(ck=>{ if(ck!==playerCampKey&&aiStrengthFactors[ck]) planets.forEach(p=>{ if(p.camp===ck) p.troop+=aiStrengthFactors[ck]; }); });
    if(diff.aiExtraGrowth) planets.forEach(p=>{ if(p.camp&&p.camp!==playerCampKey) p.troop+=1; });
    aiWeaponLogic();
    checkPowerBalance();
    if(deterrenceActive){ deterrenceTurnsLeft--; if(deterrenceTurnsLeft<=0){ endGame("deterrence"); return; }}
    checkDefeat();
    turn++; turnDom.textContent=turn; selectedPlanet=null; selectedWeapon=null; deployMode=null;
    selDom.textContent="无"; selPlanetNameDom.textContent="-"; moveWeaponBtn.disabled=true;
    updateWeaponStatusUI(); updateDrawButton(); render();
}

    const camp = CAMPS[playerCampKey]; const playerOwned = planets.filter(p=>p.camp===playerCampKey).length;
    let scoreRaw = Math.round(playerOwned*9+statKills*0.22+turn*2);
    let title="", resultText="", campMessage="";
    if(victoryType==="conquest"){ title="征服胜利"; resultText="占领全部敌方母星，一统银河！"; campMessage=camp.victorySpeech.conquest; }
    else if(victoryType==="deterrence"){ title="威慑胜利"; resultText="启动终极武器强制停战"; campMessage=camp.victorySpeech.deterrence; }
    else{ title="败北"; resultText="你的母星沦陷了，银河称霸梦碎……"; campMessage=camp.victorySpeech.defeat; }
    document.getElementById("winTitle").innerText=title; document.getElementById("resultType").innerText=resultText;
    document.getElementById("campVictoryMessage").innerText=campMessage;
    document.getElementById("statPlanet").innerText=playerOwned; document.getElementById("statKills").innerText=statKills;
    document.getElementById("statTurn").innerText=turn; document.getElementById("finalScore").innerText=scoreRaw;
    resultModal.style.display="flex"; deterrenceActive=false;
}
