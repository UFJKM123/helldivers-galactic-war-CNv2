<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>绝地潜兵银河战争（v2.3）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft Yahei}
body{background:#050512;color:#eee;display:flex;height:100vh;overflow:hidden}
#canvasWrap{flex:1}
canvas{background:#03030a;display:block}
#uiPanel{width:340px;background:#101226;padding:14px;border-left:#333a70 solid 2px;display:flex;flex-direction:column}
#uiContent{flex:1;overflow:auto}
#signature{font-size:10px;color:#555;text-align:right;margin-top:8px;padding-top:8px;border-top:1px solid #333a70}
h3{color:#80b8ff;margin-bottom:8px;font-size:16px}
.info-line{margin:5px 0;font-size:13px}
.diff-row{display:flex;gap:6px;align-items:center;margin:5px 0}
.diff-row select{flex:1;padding:5px}
.diff-row button{width:auto;padding:6px 10px;font-size:12px}
hr{margin:8px 0;border-color:#333866}
button{width:100%;padding:8px;margin:4px 0;border:none;border-radius:4px;cursor:pointer;font-weight:bold;font-size:13px}
.btn-turn{background:#278833;color:#fff}
.btn-weapon{background:#244699;color:#fff}
.btn-endgame{background:#912828;color:#fff}
.btn-deploy{background:#b8860b;color:#fff}
select{width:100%;padding:5px;margin:4px 0;font-size:13px}
.tips{font-size:11px;color:#aaa;line-height:1.5;margin-top:6px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:100;}
.modal-box{background:#121430;border:2px solid #ffdd44;padding:30px;min-width:420px;max-width:500px;text-align:center}
.modal-box h2{color:#ffdd44;margin-bottom:12px}
.modal-box p{color:#ddd;font-size:15px;margin:8px 0;line-height:1.5}
.modal-box button{margin-top:16px;width:120px;padding:8px;background:#278833;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold}
.score-text{margin:10px 0;font-size:16px}
.send-selector{display:flex;align-items:center;gap:10px;margin:6px 0}
.send-selector label{font-size:13px;color:#aaa}
.send-selector select{flex:1;padding:5px}
</style>
</head>
<body>
<div id="canvasWrap"><canvas id="starCanvas"></canvas></div>
<div id="uiPanel">
    <div id="uiContent">
        <h3>绝地潜兵银河战争（v2.3）</h3>
        <div class="info-line">选择操控阵营：</div>
        <select id="campSelect">
            <option value="EARTH">超级地球｜母星：超级地球【蓝】</option>
            <option value="TERM">终结族｜母星：佛里主星【黄】</option>
            <option value="LIGHT">光能者｜母星：西斯【紫】</option>
            <option value="ROBOT">机器人｜母星：生化斯坦【红】</option>
        </select>
        <div class="info-line">星图规模：</div>
        <select id="mapSizeSelect">
            <option value="large" selected>大（150星球）</option>
            <option value="medium">中（100星球）</option>
            <option value="small">小（60星球）</option>
        </select>
        <div class="info-line">游戏模式：</div>
        <select id="gameModeSelect">
            <option value="normal" selected>普通模式</option>
            <option value="light_assault">光能突袭</option>
            <option value="democracy_dark">民主晦暗</option>
        </select>
        <div class="diff-row">
            <select id="difficultySelect" style="width:60%;font-size:12px">
                <option value="easy">简单</option>
                <option value="normal" selected>一般</option>
                <option value="hard">困难</option>
            </select>
            <button id="randomStrengthBtn" class="btn-deploy" style="margin:0">🎲 随机强度</button>
        </div>
        <div class="info-line" id="strengthDisplay" style="font-size:11px;color:#ffcc88">各阵营强度：未分配</div>
        <button onclick="restartGame()">重新开局</button>
        <hr>
        <div class="info-line">回合：<span id="turnNum">1</span></div>
        <div class="info-line">选中对象：<span id="selText">无</span></div>
        <div class="info-line">星球名称：<span id="selPlanetName">-</span></div>
        <div class="send-selector"><label for="sendRatioSelect">派兵比例：</label><select id="sendRatioSelect"><option value="0.5">50% 兵力</option><option value="1.0" selected>全部兵力</option></select></div>
        <hr>
        <div class="info-line"><b>军备指令</b></div>
        <button class="btn-weapon" id="buildWeaponBtn">建造/部署大型武器</button>
        <button class="btn-endgame" id="buildFIN">启动终结手段【威慑胜利】</button>
        <div class="info-line" id="weaponStatus">武器状态：无</div>
        <div class="info-line" id="deterrenceStatus" style="display:none;color:#ffaa44"></div>
        <hr>
        <button class="btn-deploy" id="strategicDrawBtn">战略机遇 (等待中)</button>
        <div class="tips" id="drawInfo" style="font-size:11px;color:#aaa">消耗30兵力，每10回合可发动一次</div>
        <hr>
        <button class="btn-turn" id="nextTurnBtn">结束回合</button>
        <div class="tips" id="tipsPanel"></div>
    </div>
    <div id="signature">作者：Anklian和NoneTypes以及传奇的Deepseek和豆包</div>
</div>

<div class="modal" id="resultModal">
    <div class="modal-box">
        <h2 id="winTitle">对局结束</h2>
        <div class="score-text" id="resultType"></div>
        <div class="score-text" id="campVictoryMessage"></div>
        <div class="score-text">最终控制星球：<span id="statPlanet">0</span></div>
        <div class="score-text">累计消灭敌军兵力：<span id="statKills">0</span></div>
        <div class="score-text">存活回合：<span id="statTurn">0</span></div>
        <div class="score-text"><b>本局综合评分：<span id="finalScore">0</span></b></div>
        <br>
        <button id="watchBtn" style="display:none;background:#b8860b" onclick="startSpectate()">观战</button>
        <button onclick="closeModal();restartGame()">再来一局</button>
    </div>
</div>
<div class="modal" id="eventModal">
    <div class="modal-box"><h2 id="eventTitle">事件</h2><p id="eventMessage"></p><button onclick="closeEventModal()">确定</button></div>
</div>

window.onload=init;
window.addEventListener("resize",resizeCanvas);

function init(){
    canvas=document.getElementById("starCanvas"); ctx=canvas.getContext("2d");
    turnDom=document.getElementById("turnNum"); selDom=document.getElementById("selText"); selPlanetNameDom=document.getElementById("selPlanetName");
    weaponDom=document.getElementById("weaponStatus"); deterrenceStatusDom=document.getElementById("deterrenceStatus");
    resultModal=document.getElementById("resultModal"); eventModal=document.getElementById("eventModal");
    sendRatioSelect=document.getElementById("sendRatioSelect"); difficultySelect=document.getElementById("difficultySelect");
    buildWeaponBtn=document.getElementById("buildWeaponBtn"); tipsPanel=document.getElementById("tipsPanel");
    strategicDrawBtn=document.getElementById("strategicDrawBtn"); watchBtn=document.getElementById("watchBtn");

    buildWeaponBtn.onclick=onBuildWeapon;
    document.getElementById("buildFIN").onclick=activateFinal;
    document.getElementById("nextTurnBtn").onclick=nextTurn;
    document.getElementById("randomStrengthBtn").onclick=randomizeEnemyStrength;
    canvas.onclick=canvasClick;
    strategicDrawBtn.onclick=performStrategicDraw;
    document.getElementById("campSelect").onchange=restartGame;
    document.getElementById("mapSizeSelect").onchange=restartGame;
    document.getElementById("gameModeSelect").onchange=restartGame;
    resizeCanvas(); restartGame(); updateTips();
}

function resizeCanvas(){ canvas.width=window.innerWidth-340; canvas.height=window.innerHeight; if(planets.length)render(); }

function restartGame(){
    playerCampKey=document.getElementById("campSelect").value;
    difficulty=difficultySelect.value;
    gameMode=document.getElementById("gameModeSelect").value;
    currentMapSize=document.getElementById("mapSizeSelect").value; currentConfig=MAP_SIZES[currentMapSize];
    turn=1; lastDrawTurn=0; selectedWeapon=null; statKills=0; blockedLinks.clear();
    planets=[]; links=[]; weapons=[]; deterrenceActive=false; deterrenceTurnsLeft=0; aiStrengthFactors={};
    CAMP_KEYS.forEach(ck=>{if(ck!==playerCampKey)aiStrengthFactors[ck]=0;});
    eliminationsTriggered.clear(); maiaRiverTriggered=false; lastWeakCamp=null; weakWarningTriggered=false; spectateMode=false;
    eventQueue = []; selectedPlanets = []; homeFallTriggered.clear();
    turnDom.textContent=turn; selDom.textContent="无"; selPlanetNameDom.textContent="-"; updateWeaponStatusUI();
    resultModal.style.display="none"; eventModal.style.display="none"; sendRatioSelect.value="1.0";
    if(deterrenceStatusDom)deterrenceStatusDom.style.display="none"; updateDrawButton(); generateGalaxy();

    if(gameMode === "democracy_dark"){
        const darkTurns = currentConfig.darkTurns;
        for(let i=0; i<darkTurns; i++){
            CAMP_KEYS.filter(ck=>ck!==playerCampKey).forEach(ck=>{
                const diff = getDifficultyParams();
                aiActionNeutralOnly(ck, diff.aiThreshold);
                planets.forEach(p=>{if(p.camp===ck){ p.troop+=1; if(p.resource) p.troop+=2; }});
            });
        }
        turn = 1;
        turnDom.textContent = turn;
    }
    updateTips(); updateStrengthDisplay(); render();
}

function getDifficultyParams(){
    switch(difficulty){
        case 'easy': return {neutMin:4,neutMax:14,aiThreshold:20,aiExtraGrowth:false};
        case 'hard': return {neutMin:12,neutMax:38,aiThreshold:5,aiExtraGrowth:true};
        default: return {neutMin:6,neutMax:22,aiThreshold:10,aiExtraGrowth:false};
    }
}

function generateGalaxy(){
    const W=canvas.width,H=canvas.height,pad=currentConfig.canvasPad;
    const corners=[{x:pad,y:pad},{x:W-pad,y:pad},{x:pad,y:H-pad},{x:W-pad,y:H-pad}];
    const shuffled=[...CAMP_KEYS].sort(()=>Math.random()-0.5);
    shuffled.forEach((ck,idx)=>{ planets.push({x:corners[idx].x,y:corners[idx].y,camp:ck,originalCamp:ck,isHome:true,troop:70,planetName:CAMPS[ck].homeName,uid:Math.random().toString(36).slice(2,10),resource:false}); });
    const earthPlanet=planets.find(p=>p.camp==="EARTH"&&p.isHome);
    if(earthPlanet){
        let ox = earthPlanet.x + 80, oy = earthPlanet.y + 50;
        if(ox > W - pad) ox = earthPlanet.x - 80;
        if(oy > H - pad) oy = earthPlanet.y - 50;
        if(ox < pad) ox = earthPlanet.x + 40;
        if(oy < pad) oy = earthPlanet.y + 40;
        planets.push({x:ox,y:oy,camp:"EARTH",originalCamp:"EARTH",isHome:false,troop:10,planetName:"麦拉芬蒙河",uid:Math.random().toString(36).slice(2,10),resource:false});
    }
    const diff=getDifficultyParams();
    let namePool=[...PLANET_NAME_LIST].sort(()=>Math.random()-0.5);
    const totalNormal=currentConfig.planetTotal-5;
    const resourceIndices=new Set();
    while(resourceIndices.size<currentConfig.resourceCount)resourceIndices.add(Math.floor(Math.random()*totalNormal));
    for(let i=0;i<totalNormal;i++){
        let x,y; do{x=pad+Math.random()*(W-pad*2);y=pad+Math.random()*(H-pad*2);}while(planets.some(p=>Math.hypot(p.x-x,p.y-y)<40));
        const initT=Math.floor(Math.random()*(diff.neutMax-diff.neutMin))+diff.neutMin;
        let pname=namePool.length>0?namePool.shift():"星球"+i;
        planets.push({x,y,camp:null,originalCamp:null,isHome:false,troop:initT,planetName:pname,uid:Math.random().toString(36).slice(2,10),resource:resourceIndices.has(i)});
    }
    buildConnections(); ensureConnectivity();
}

function buildConnections(){
    links=[]; const count=currentConfig.linksPerPlanet;
    planets.forEach(p=>{
        const others=planets.filter(o=>o.uid!==p.uid).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y)).slice(0,count);
        others.forEach(t=>{const idPair=[p.uid,t.uid].sort().join("_");if(!links.some(l=>l.idPair===idPair))links.push({a:p,b:t,idPair});});
    });
}

function ensureConnectivity(){
    planets.forEach(p=>{
        const hasLink = links.some(l=>l.a.uid===p.uid||l.b.uid===p.uid);
        if(!hasLink){
            const nearest = planets.filter(o=>o.uid!==p.uid).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];
            if(nearest){ const idPair = [p.uid,nearest.uid].sort().join("_"); if(!links.some(l=>l.idPair===idPair)) links.push({a:p,b:nearest,idPair}); }
        }
    });
}

function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    links.forEach(ln=>{
        const isBlock=blockedLinks.has(ln.idPair);
        ctx.beginPath(); ctx.moveTo(ln.a.x,ln.a.y); ctx.lineTo(ln.b.x,ln.b.y);
        ctx.strokeStyle=isBlock?"#772222":"#283060"; ctx.lineWidth=isBlock?2:1; ctx.stroke();
    });
    planets.forEach(p=>{
        const r=p.isHome?16:10; const campData=p.camp?CAMPS[p.camp]:null;
        if(selectedPlanets.some(sp=>sp.uid===p.uid)){
            ctx.beginPath(); ctx.arc(p.x,p.y,r+6,0,Math.PI*2); ctx.strokeStyle="#ffd700"; ctx.lineWidth=2; ctx.stroke();
        }
        if(selectedWeapon && selectedWeapon.planetId === p.uid){
            ctx.beginPath(); ctx.arc(p.x,p.y,r+5,0,Math.PI*2); ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.stroke();
        }
        ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle=campData?campData.color:"#505050";ctx.fill();
        if(p.isHome){ctx.beginPath();ctx.arc(p.x,p.y,r+3,0,Math.PI*2);ctx.strokeStyle="#ffdd00";ctx.lineWidth=2;ctx.stroke();}
        if(p.resource){ctx.fillStyle="#ffaa00";ctx.font="12px Arial";ctx.fillText("◆",p.x,p.y-r-2);}
        ctx.fillStyle="#fff";ctx.font="bold 11px Arial";ctx.textAlign="center";ctx.fillText(p.troop,p.x,p.y+r+13);
        ctx.fillStyle="#aaa";ctx.font="8px Microsoft Yahei";ctx.fillText(p.planetName,p.x,p.y+r+22);
        const planetWeapons=weapons.filter(w=>w.planetId===p.uid);
        if(planetWeapons.length){
            let yOff=p.y-r-8;
            planetWeapons.forEach(w=>{const wc=CAMPS[w.camp];ctx.fillStyle=wc?wc.color:"#fff";ctx.font="16px Arial";ctx.fillText(w.type==='mobile'?'◈':'⬢',p.x,yOff);yOff-=16;});
        }
    });
}

function findWeaponAtPos(mx,my){
    for(let w of weapons){
        const planet=planets.find(p=>p.uid===w.planetId); if(!planet)continue;
        const r=planet.isHome?16:10; const planetWeapons=weapons.filter(wp=>wp.planetId===planet.uid); const index=planetWeapons.indexOf(w); if(index===-1)continue;
        const yCenter=planet.y-r-8-16*index-8; if(mx>=planet.x-8&&mx<=planet.x+8&&my>=yCenter-8&&my<=yCenter+8)return w;
    }
    return null;
}

function canvasClick(evt){
    if(spectateMode)return;
    const rect=canvas.getBoundingClientRect(); const mx=evt.clientX-rect.left,my=evt.clientY-rect.top;
    const clickedWeapon=findWeaponAtPos(mx,my);
    if(clickedWeapon && clickedWeapon.camp === playerCampKey){
        selectedWeapon=clickedWeapon; selectedPlanets=[];
        selDom.textContent=`武器：${CAMPS[playerCampKey].lwName}`; selPlanetNameDom.textContent=planets.find(p=>p.uid===clickedWeapon.planetId)?.planetName||'-';
        render(); return;
    }
    const hitPlanet=planets.find(p=>Math.hypot(p.x-mx,p.y-my)<20);
    if(!hitPlanet){ selectedWeapon=null; selectedPlanets=[]; selDom.textContent="无"; selPlanetNameDom.textContent="-"; render(); return; }

    if(selectedWeapon){
        if(selectedWeapon.type==='mobile' && hitPlanet.camp===playerCampKey){
            selectedWeapon.planetId=hitPlanet.uid; selectedWeapon=null; selectedPlanets=[];
            updateWeaponStatusUI(); render();
        }else{ alert("只能移动武器到己方星球"); selectedWeapon=null; }
        return;
    }

    const shiftKey = evt.shiftKey;
    if(shiftKey){
        if(hitPlanet.camp !== playerCampKey){ alert("只能选择己方星球加入多选！"); return; }
        const idx = selectedPlanets.findIndex(p=>p.uid===hitPlanet.uid);
        if(idx >= 0) selectedPlanets.splice(idx,1);
        else selectedPlanets.push(hitPlanet);
        selDom.textContent = selectedPlanets.length>0 ? `已选中 ${selectedPlanets.length} 颗星球` : "无";
        selPlanetNameDom.textContent = selectedPlanets.length>0 ? selectedPlanets.map(p=>p.planetName).join('、') : '-';
        render();
    } else {
        if(selectedPlanets.length === 0){
            selectedPlanets = [hitPlanet];
            selDom.textContent = hitPlanet.camp ? CAMPS[hitPlanet.camp].name : "中立星球";
            selPlanetNameDom.textContent = hitPlanet.planetName;
            render();
        } else if(selectedPlanets.length === 1){
            const source = selectedPlanets[0];
            if(source.uid === hitPlanet.uid){ selectedPlanets=[]; selDom.textContent="无"; selPlanetNameDom.textContent="-"; render(); return; }
            if(source.camp !== playerCampKey){ alert("请选中己方星球操作！"); return; }
            const linkCheck = links.find(l=>(l.a.uid===source.uid&&l.b.uid===hitPlanet.uid)||(l.b.uid===source.uid&&l.a.uid===hitPlanet.uid));
            if(!linkCheck){ alert("只能进攻相邻星球！"); return; }
            if(blockedLinks.has(linkCheck.idPair)){ alert("航道被封锁！"); return; }
            if(hitPlanet.camp === playerCampKey){
                moveTroops(source, hitPlanet);
            } else {
                if(source.troop<=0){ alert("没有兵力！"); } else { executeAttack(source, hitPlanet); checkDefeat(); }
            }
            selectedPlanets=[]; selDom.textContent="无"; selPlanetNameDom.textContent="-"; render();
        } else {
            if(hitPlanet.camp === playerCampKey){
                const ratio = getSendRatio();
                for(let from of selectedPlanets){
                    if(from.uid === hitPlanet.uid) continue;
                    const sendTroop = Math.floor(from.troop * ratio);
                    if(sendTroop > 0){ from.troop -= sendTroop; hitPlanet.troop += sendTroop; }
                }
            } else {
                for(let from of selectedPlanets){
                    if(from.camp !== playerCampKey || from.troop<=0) continue;
                    const linkCheck = links.find(l=>(l.a.uid===from.uid&&l.b.uid===hitPlanet.uid)||(l.b.uid===from.uid&&l.a.uid===hitPlanet.uid));
                    if(!linkCheck || blockedLinks.has(linkCheck.idPair)) continue;
                    executeAttack(from, hitPlanet);
                }
                checkDefeat();
            }
            selectedPlanets=[]; selDom.textContent="无"; selPlanetNameDom.textContent="-"; render();
        }
    }
}

function moveTroops(from,to){const ratio=getSendRatio();const sendTroop=Math.floor(from.troop*ratio);if(sendTroop<=0){alert("兵力不足");return;}from.troop-=sendTroop;to.troop+=sendTroop;}

function executeAttack(from,to){
    const ratio=getSendRatio();let attackTroop=Math.floor(from.troop*ratio);from.troop-=attackTroop;const oldCamp=to.camp;
    const targetWeapons=weapons.filter(w=>w.planetId===to.uid);let guardBonus=0,weakenEffect=0;
    targetWeapons.forEach(w=>{if(w.type==='deploy'){if(to.camp===w.camp)guardBonus+=w.guardBonus;else weakenEffect+=w.weaken;}else if(w.type==='mobile'){if(to.camp===w.camp){guardBonus+=w.guardBonus;weakenEffect+=w.weaken;}}});
    let defendTroop=to.troop+guardBonus;let effectiveAttack=Math.max(0,attackTroop-weakenEffect);const result=effectiveAttack-defendTroop;
    if(result>0){statKills+=to.troop;to.camp=from.camp;to.troop=result;weapons=weapons.filter(w=>!(w.planetId===to.uid&&w.camp!==to.camp));onPlanetCaptured(to,oldCamp,from.camp);checkConquestWin();}
    else{statKills+=Math.min(attackTroop,to.troop);to.troop=Math.max(1,to.troop-attackTroop);}
}

function onPlanetCaptured(planet,oldCamp,newCamp){
    if(planet.planetName==="麦拉芬蒙河"&&oldCamp==="EARTH"&&newCamp==="ROBOT"&&!maiaRiverTriggered){maiaRiverTriggered=true;showEventModal("麦拉芬蒙河战败","机器人攻陷了战略要地麦拉芬蒙河。");}

        if(newCamp===playerCampKey && oldCamp!==playerCampKey) showEventModal("母星占领",`我军占领了敌方母星：${planet.planetName}！`);
        else if(oldCamp===playerCampKey && newCamp!==playerCampKey) showEventModal("母星沦陷",`警报！我方母星 ${planet.planetName} 已被敌人占领！`);
    }
    checkEliminations();
}

function updateDrawButton(){
    if(turn<10){strategicDrawBtn.textContent="战略机遇 (第10回合解锁)";strategicDrawBtn.disabled=true;return;}
    const remaining=10-(turn-lastDrawTurn);
    if(remaining<=0){strategicDrawBtn.textContent="战略机遇 (可用)";strategicDrawBtn.disabled=false;}else{strategicDrawBtn.textContent=`战略机遇 (冷却 ${remaining} 回合)`;strategicDrawBtn.disabled=true;}
}

function performStrategicDraw(){
    if(spectateMode)return;if(turn<10){alert("前10回合无法使用战略机遇");return;}
    if(turn-lastDrawTurn<10){alert(`冷却中，还需等待${10-(turn-lastDrawTurn)}回合`);return;}
    const myPlanets=planets.filter(p=>p.camp===playerCampKey&&p.troop>=30);if(myPlanets.length===0){alert("没有星球兵力达到30");return;}
    const payer=myPlanets[Math.floor(Math.random()*myPlanets.length)];payer.troop-=30;
    const campEvents=STRATEGIC_EVENTS[playerCampKey];const isPositive=Math.random()<0.5;
    const pool=isPositive?campEvents.positive:campEvents.negative;const event=pool[Math.floor(Math.random()*pool.length)];
    const targetPlanet=planets.filter(p=>p.camp===playerCampKey)[Math.floor(Math.random()*planets.filter(p=>p.camp===playerCampKey).length)];if(!targetPlanet)return;
    const oldTroop=targetPlanet.troop;const effectAmt=isPositive?Math.floor(Math.random()*25)+25:Math.floor(Math.random()*20)+5;
    if(isPositive)targetPlanet.troop+=effectAmt;else targetPlanet.troop=Math.max(1,targetPlanet.troop-effectAmt);
    lastDrawTurn=turn;updateDrawButton();
    const finalDesc=event.desc.replace(/{planet}/g,targetPlanet.planetName);const change=isPositive?`+${effectAmt}`:`-${effectAmt}`;
    showEventModal(`战略机遇：${event.title} (${isPositive?'正面':'负面'})`,`${finalDesc}\n目标：${targetPlanet.planetName}\n兵力变化：${change}（当前：${targetPlanet.troop}）`);
    render();
}

function randomizeEnemyStrength(){const enemyCamps=CAMP_KEYS.filter(ck=>ck!==playerCampKey);aiStrengthFactors={};enemyCamps.forEach(ck=>{aiStrengthFactors[ck]=Math.floor(Math.random()*4);});updateStrengthDisplay();showEventModal("随机强度分配","各敌方阵营已获得不同的额外兵力增长。");}
function updateStrengthDisplay(){const display=document.getElementById("strengthDisplay");if(!display)return;const enemyCamps=CAMP_KEYS.filter(ck=>ck!==playerCampKey);if(Object.keys(aiStrengthFactors).length===0||enemyCamps.every(ck=>!aiStrengthFactors[ck])){display.textContent="各阵营强度：未分配";return;}let text="各阵营强度：";enemyCamps.forEach(ck=>{text+=`${CAMPS[ck].name}+${aiStrengthFactors[ck]||0} `;});display.textContent=text;}

function aiActionNeutralOnly(campKey, threshold){
    const aiPlanets = planets.filter(p=>p.camp===campKey);
    aiPlanets.forEach(ownPlanet => {
        if(ownPlanet.troop < threshold) return;
        let targets = [];
        links.forEach(ln=>{
            if(ln.a.uid===ownPlanet.uid && ln.b.camp===null && !blockedLinks.has(ln.idPair)) targets.push(ln.b);
            else if(ln.b.uid===ownPlanet.uid && ln.a.camp===null && !blockedLinks.has(ln.idPair)) targets.push(ln.a);
        });
        if(targets.length===0) return;
        targets.sort((a,b)=>a.troop-b.troop);
        const target = targets[0];
        const send = Math.floor(ownPlanet.troop * 0.7);
        ownPlanet.troop -= send;
        const res = send - target.troop;
        if(res > 0){ target.camp = campKey; target.troop = res; }
        else { target.troop = Math.max(1, target.troop - send); }
    });
    const campDef = CAMPS[campKey];
    if(campDef.weaponType==='mobile' && !weapons.some(w=>w.camp===campKey && w.type==='mobile')){
        let buildPlanet = aiPlanets.find(p=>p.isHome) || aiPlanets.reduce((a,b)=>a.troop>b.troop?a:b);
        if(buildPlanet.troop >= 180){ buildPlanet.troop -= 180; weapons.push({id:Math.random().toString(36).slice(2,8), camp:campKey, type:'mobile', planetId:buildPlanet.uid, guardBonus:campDef.guardBonus, weaken:campDef.weaken, decay:0}); }
    }
}

function aiWeaponLogic(){
    CAMP_KEYS.filter(c=>c!==playerCampKey).forEach(campKey => {
        const campDef = CAMPS[campKey];
        const aiPlanets = planets.filter(p=>p.camp===campKey);
        if(aiPlanets.length===0) return;

        if(campDef.weaponType === 'mobile'){
            const existing = weapons.find(w=>w.camp===campKey && w.type==='mobile');
            if(!existing){
                let buildPlanet = aiPlanets.find(p=>p.isHome) || aiPlanets.reduce((a,b)=>a.troop>b.troop?a:b);
                if(buildPlanet.troop >= 180){
                    buildPlanet.troop -= 180;
                    weapons.push({id:Math.random().toString(36).slice(2,8), camp:campKey, type:'mobile', planetId:buildPlanet.uid, guardBonus:campDef.guardBonus, weaken:campDef.weaken, decay:0});
                }
            } else {
                let bestTarget = null, bestScore = -Infinity;
                aiPlanets.forEach(p=>{
                    const hasEnemyAdj = links.some(ln=>(ln.a.uid===p.uid&&ln.b.camp!==campKey&&!blockedLinks.has(ln.idPair))||(ln.b.uid===p.uid&&ln.a.camp!==campKey&&!blockedLinks.has(ln.idPair)));
                    if(hasEnemyAdj && p.troop > bestScore){ bestScore=p.troop; bestTarget=p; }
                });
                if(!bestTarget) bestTarget = aiPlanets.reduce((a,b)=>a.troop>b.troop?a:b);
                existing.planetId = bestTarget.uid;
            }
        } else if(campDef.weaponType === 'deploy'){
            // 每5回合在己方星球部署一次阴霾/寂域（增强防守）
            if(turn % 5 === 0 && aiPlanets.length > 0){
                let target = aiPlanets.find(p => links.some(ln => (ln.a.uid===p.uid && ln.b.camp!==campKey && !blockedLinks.has(ln.idPair)) || (ln.b.uid===p.uid && ln.a.camp!==campKey && !blockedLinks.has(ln.idPair))));
                if(!target) target = aiPlanets.reduce((a,b) => a.troop > b.troop ? a : b);
                const payer = aiPlanets.reduce((a,b) => a.troop > b.troop ? a : b);
                if(payer.troop >= 150){
                    payer.troop -= 150;
                    weapons.push({
                        id: Math.random().toString(36).slice(2,8),
                        camp: campKey,
                        type: 'deploy',
                        planetId: target.uid,
                        guardBonus: campDef.guardBonus,
                        weaken: campDef.weaken,
                        decay: campDef.decay || 0
                    });
                }
            }
        }
    });
}

function aiTransferTroops(campKey){
    const aiPlanets = planets.filter(p=>p.camp===campKey); if(aiPlanets.length<2) return;
    const frontPlanets = aiPlanets.filter(p=>links.some(ln=>(ln.a.uid===p.uid&&ln.b.camp!==campKey&&!blockedLinks.has(ln.idPair))||(ln.b.uid===p.uid&&ln.a.camp!==campKey&&!blockedLinks.has(ln.idPair))));
    if(frontPlanets.length===0) return;
    aiPlanets.forEach(p=>{
        if(frontPlanets.includes(p) || p.troop<=10) return;
        let bestTarget=null, bestDist=Infinity;
        frontPlanets.forEach(fp=>{ const ln=links.find(l=>(l.a.uid===p.uid&&l.b.uid===fp.uid)||(l.b.uid===p.uid&&l.a.uid===fp.uid)); if(ln&&!blockedLinks.has(ln.idPair)){ const d=Math.hypot(p.x-fp.x,p.y-fp.y); if(d<bestDist){bestDist=d; bestTarget=fp;} } });
        if(bestTarget){ const transfer = Math.floor(p.troop * 0.7); p.troop -= transfer; bestTarget.troop += transfer; }
    });
    const mobileWeapon = weapons.find(w=>w.camp===campKey && w.type==='mobile');
    if(mobileWeapon){ const strongestFront = frontPlanets.reduce((a,b)=>a.troop>b.troop?a:b, frontPlanets[0]); if(strongestFront) mobileWeapon.planetId = strongestFront.uid; }
}

function lightAssaultEvent(){
    const neutralPlanets = planets.filter(p=>p.camp===null);
    if(neutralPlanets.length===0) return;
    let totalPower = 0;
    planets.forEach(p=>{ if(p.camp) totalPower += p.troop; });
    const assaultPower = Math.floor(totalPower * 0.4);
    const targetCount = Math.min(neutralPlanets.length, Math.floor(currentConfig.planetTotal * 0.1));
    const selectedTargets = neutralPlanets.sort(()=>Math.random()-0.5).slice(0, targetCount);
    const avgTroop = Math.floor(assaultPower / targetCount);
    selectedTargets.forEach(p=>{ p.camp = "LIGHT"; p.troop = avgTroop; });
    const lightHome = planets.find(p=>p.isHome && p.camp==="LIGHT");
    if(lightHome) lightHome.troop += Math.floor(assaultPower * 0.3);
    showEventModal("光能突袭", "光能者大军突然降临，占领了多个星球！西斯舰队开始全面反攻。");
}

function nextTurn(){
    const diff=getDifficultyParams();
    weapons.forEach(w=>{if(w.type==='deploy'&&w.decay>0){const p=planets.find(p=>p.uid===w.planetId);if(p&&p.camp!==w.camp)p.troop=Math.max(1,p.troop-w.decay);}});
    CAMP_KEYS.filter(ck=>ck!==playerCampKey).forEach(ck=>aiTransferTroops(ck));
    planets.forEach(p=>{if(p.camp&&p.camp!==playerCampKey)aiAction(p,diff.aiThreshold,deterrenceActive?playerCampKey:null);});
    if(deterrenceActive){const playerHome=planets.find(p=>p.isHome&&p.camp===playerCampKey);if(!playerHome){endGame("defeat");return;}}
    if(!deterrenceActive){planets.forEach(p=>{if(p.camp===playerCampKey)p.troop+=1;if(p.camp===playerCampKey&&p.resource)p.troop+=2;});}
    planets.forEach(p=>{if(p.camp&&p.camp!==playerCampKey)p.troop+=1;if(p.camp&&p.camp!==playerCampKey&&p.resource)p.troop+=2;});
    CAMP_KEYS.forEach(ck=>{if(ck!==playerCampKey&&aiStrengthFactors[ck])planets.forEach(p=>{if(p.camp===ck)p.troop+=aiStrengthFactors[ck];});});
    if(diff.aiExtraGrowth)planets.forEach(p=>{if(p.camp&&p.camp!==playerCampKey)p.troop+=1;});
    aiWeaponLogic();
    checkPowerBalance();
    if(gameMode==="light_assault" && turn === 20){ lightAssaultEvent(); }
    if(deterrenceActive){deterrenceTurnsLeft--;if(deterrenceTurnsLeft<=0){endGame("deterrence");return;}}
    checkHomeFallEvents();
    if(!spectateMode)checkDefeat();
    turn++;turnDom.textContent=turn;selectedWeapon=null;selectedPlanets=[];selDom.textContent="无";selPlanetNameDom.textContent="-";
    updateWeaponStatusUI();updateDrawButton();render();
}

function aiAction(ownPlanet,threshold,onlyCamp=null){
    if(ownPlanet.troop<threshold)return;
    let targets=[];
    links.forEach(ln=>{
        if(ln.a.uid===ownPlanet.uid&&ln.b.camp!==ownPlanet.camp&&!blockedLinks.has(ln.idPair)){if(onlyCamp===null||ln.b.camp===onlyCamp)targets.push(ln.b);}
        else if(ln.b.uid===ownPlanet.uid&&ln.a.camp!==ownPlanet.camp&&!blockedLinks.has(ln.idPair)){if(onlyCamp===null||ln.a.camp===onlyCamp)targets.push(ln.a);}
    });
    if(targets.length===0)return;
    const playerHome=planets.find(p=>p.isHome&&p.camp===playerCampKey);const homeTarget=targets.find(t=>t.uid===playerHome?.uid);
    if(homeTarget)targets=[homeTarget];
    else{const resTargets=targets.filter(t=>t.resource);if(resTargets.length>0){resTargets.sort((a,b)=>a.troop-b.troop);targets=[resTargets[0]];}else{targets.sort((a,b)=>a.troop-b.troop);}}
    const target=targets[0];const oldCamp=target.camp;
    const ratio=(ownPlanet.troop>target.troop*2)?0.9:0.7;const send=Math.floor(ownPlanet.troop*ratio);ownPlanet.troop-=send;
    const targetWeapons=weapons.filter(w=>w.planetId===target.uid);let guardBonus=0,weaken=0;
    targetWeapons.forEach(w=>{if(w.type==='deploy'){if(target.camp===w.camp)guardBonus+=w.guardBonus;else weaken+=w.weaken;}else if(w.type==='mobile'){if(target.camp===w.camp){guardBonus+=w.guardBonus;weaken+=w.weaken;}}});
    let effectiveAttack=Math.max(0,send-weaken);const defendTroop=target.troop+guardBonus;const res=effectiveAttack-defendTroop;
    if(res>0){target.camp=ownPlanet.camp;target.troop=res;weapons=weapons.filter(w=>!(w.planetId===target.uid&&w.camp!==target.camp));onPlanetCaptured(target,oldCamp,ownPlanet.camp);checkConquestWin();if(!spectateMode)checkDefeat();}
    else{target.troop=Math.max(1,target.troop-send);}
}

function checkPowerBalance(){
    if(turn<=40||weakWarningTriggered)return;
    const power={};CAMP_KEYS.forEach(ck=>{power[ck]=planets.filter(p=>p.camp===ck).reduce((s,p)=>s+p.troop,0);});
    const entries=Object.entries(power).filter(([_,v])=>v>0&&_!==playerCampKey);if(entries.length===0)return;
    const playerPower=power[playerCampKey]||0;
    if(entries.every(([_,v])=>v>playerPower*1.5)){weakWarningTriggered=true;showEventModal("势力衰弱","我方总兵力已远逊于各个敌对势力，形势危急！");}
}

function getSendRatio(){return parseFloat(sendRatioSelect.value||"1.0");}

function activateFinal(){
    if(spectateMode)return;if(deterrenceActive){alert("终结手段已经启动！");return;}
    const camp=getCampWeaponDef(playerCampKey);if(!weapons.some(w=>w.camp===playerCampKey)){alert(`需要先建造/部署${camp.lwName}`);return;}
    const planet = selectedPlanets.length===1 ? selectedPlanets[0] : null;
    if(!planet || planet.camp!==playerCampKey){alert("选中己方星球启动");return;}if(planet.troop<400){alert("需要400兵力");return;}
    planet.troop-=400;deterrenceActive=true;deterrenceTurnsLeft=5;updateWeaponStatusUI();render();showEventModal("终结手段启动","所有敌人将联合进攻，我方停止增长，持续5回合。守住母星即可获胜！");
}

function endGame(victoryType){
    if(spectateMode)return;const camp=CAMPS[playerCampKey];const playerOwned=planets.filter(p=>p.camp===playerCampKey).length;
    let scoreRaw=Math.round(playerOwned*9+statKills*0.22+turn*2);let title="",resultText="",campMessage="";
    if(victoryType==="conquest"){title="征服胜利";resultText="占领全部敌方母星，一统银河！";campMessage=camp.victorySpeech.conquest;}
    else if(victoryType==="deterrence"){title="威慑胜利";resultText="启动终极武器强制停战";campMessage=camp.victorySpeech.deterrence;}
    else{title="败北";resultText="你的最后一颗星球沦陷了，银河称霸梦碎";campMessage=camp.victorySpeech.defeat;}
    document.getElementById("winTitle").innerText=title;document.getElementById("resultType").innerText=resultText;
    document.getElementById("campVictoryMessage").innerText=campMessage;document.getElementById("statPlanet").innerText=playerOwned;
    document.getElementById("statKills").innerText=statKills;document.getElementById("statTurn").innerText=turn;document.getElementById("finalScore").innerText=scoreRaw;
    watchBtn.style.display=(victoryType==="defeat")?"inline-block":"none";resultModal.style.display="flex";deterrenceActive=false;
}

function startSpectate(){ resultModal.style.display="none"; spectateMode = true; }
function closeModal(){ resultModal.style.display="none"; }
</script>
