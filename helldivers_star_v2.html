<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>绝地潜兵星图领主 终极版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft Yahei}
body{background:#050512;color:#eee;display:flex;height:100vh;overflow:hidden}
#canvasWrap{flex:1}
canvas{background:#03030a;display:block}
#uiPanel{width:340px;background:#101226;padding:14px;border-left:#333a70 solid 2px;overflow:auto}
h3{color:#80b8ff;margin-bottom:12px}
.info-line{margin:7px 0;font-size:14px}
hr{margin:12px 0;border-color:#333866}
button{width:100%;padding:9px;margin:5px 0;border:none;border-radius:5px;cursor:pointer;font-weight:bold}
.btn-turn{background:#278833;color:#fff}
.btn-weapon{background:#244699;color:#fff}
.btn-endgame{background:#912828;color:#fff}
.btn-deploy{background:#b8860b;color:#fff}
select{width:100%;padding:6px;margin:6px 0}
.tips{font-size:12px;color:#aaa;line-height:1.6;margin-top:10px}
.modal{
    position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);
    display:none;align-items:center;justify-content:center;
}
.modal-box{
    background:#121430;border:2px solid #ffdd44;padding:32px;min-width:460px;text-align:center
}
.score-text{margin:10px 0;font-size:16px}
.send-selector{display:flex;align-items:center;gap:10px;margin:8px 0}
.send-selector label{font-size:14px;color:#aaa}
.send-selector select{flex:1;padding:6px}
</style>
</head>
<body>
<div id="canvasWrap">
    <canvas id="starCanvas"></canvas>
</div>
<div id="uiPanel">
    <h3>星图领主 · 终极版</h3>
    <div class="info-line">选择操控阵营：</div>
    <select id="campSelect">
        <option value="EARTH">超级地球｜母星：超级地球【蓝】</option>
        <option value="TERM">终结族｜母星：佛里主星【黄】</option>
        <option value="LIGHT">光能者｜母星：西斯【紫】</option>
        <option value="ROBOT">机器人｜母星：生化斯坦【红】</option>
    </select>
    <div class="info-line">难度选择：</div>
    <select id="difficultySelect">
        <option value="easy">简单</option>
        <option value="normal" selected>一般</option>
        <option value="hard">困难</option>
    </select>
    <button onclick="restartGame()">重新开局（应用设置）</button>
    <hr>
    <div class="info-line">回合：<span id="turnNum">1</span></div>
    <div class="info-line">选中对象：<span id="selText">无</span></div>
    <div class="info-line">星球名称：<span id="selPlanetName">-</span></div>
    <hr>
    <div class="send-selector">
        <label for="sendRatioSelect">派兵比例：</label>
        <select id="sendRatioSelect">
            <option value="0.5">50% 兵力</option>
            <option value="1.0">全部兵力</option>
        </select>
    </div>
    <hr>
    <div class="info-line"><b>军备指令</b></div>
    <button class="btn-weapon" id="buildWeaponBtn">建造/部署大型武器</button>
    <button class="btn-deploy" id="moveWeaponBtn" disabled>移动武器 (选中移动型武器)</button>
    <button class="btn-endgame" id="buildFIN">启动终结手段【威慑胜利】</button>
    <div class="info-line" id="weaponStatus">武器状态：无</div>
    <hr>
    <button class="btn-turn" id="nextTurnBtn">结束回合</button>
    <div class="tips" id="tipsPanel"></div>
</div>

<div class="modal" id="resultModal">
    <div class="modal-box">
        <h2 id="winTitle">对局结束</h2>
        <div class="score-text" id="resultType"></div>
        <div class="score-text">最终控制星球：<span id="statPlanet">0</span></div>
        <div class="score-text">累计消灭敌军兵力：<span id="statKills">0</span></div>
        <div class="score-text">存活回合：<span id="statTurn">0</span></div>
        <div class="score-text"><b>本局综合评分：<span id="finalScore">0</span></b></div>
        <br>
        <button onclick="closeModal();restartGame()">再来一局</button>
    </div>
</div>

<script>
// ==================== 配置 ====================
const CONFIG = {
    planetTotal: 150,
    canvasPad: 60,
    homeInitTroop: 70,
    buildMoveCost: 180,
    deployCost: 150,
    finalCost: 320,
    resourceCount: 15       // 资源星球数量
};

const CAMPS = {
    EARTH:{
        name:"超级地球", color:"#4499ff", homeName:"超级地球",
        lwName:"DSS轨道平台", finName:"和平之星",
        weaponType:"mobile",
        guardBonus: 25, weaken: 15
    },
    TERM:{
        name:"终结族", color:"#ffcc22", homeName:"佛里主星",
        lwName:"阴霾", finName:"协同信息素",
        weaponType:"deploy",
        guardBonus: 20, weaken: 15, decay: 5
    },
    LIGHT:{
        name:"光能者", color:"#9944dd", homeName:"西斯",
        lwName:"寂域", finName:"黑洞发生器",
        weaponType:"deploy",
        guardBonus: 20, weaken: 15, decay: 5
    },
    ROBOT:{
        name:"机器人", color:"#dd2222", homeName:"生化斯坦",
        lwName:"ASS攻击阵列", finName:"死星光束",
        weaponType:"mobile",
        guardBonus: 25, weaken: 15
    }
};
const CAMP_KEYS = ["EARTH","TERM","LIGHT","ROBOT"];

// 全部中文星球名称库
const PLANET_NAME_LIST = [
    "奥肖恩星","莫里迪亚","杜马提尔","克伦达苏","艾维斯","莫拉戴什",
    "沃提斯","利索斯","塞拉瑞","瓦提昂","利斯瑞斯","泽菲拉",
    "塔西斯","沃拉克","尼克斯","科尔瓦","厄林多","奎拉斯","维斯佩拉",
    "派罗尼斯","加兰提斯","泰罗斯","内维昂","塞里尼斯","萨洛昂","沃克西斯",
    "泽里斯","水晶星","伊利里亚","沃拉思","维克西隆","伊德里斯","瓦尼斯12",
    "赛罗尼斯","弗洛兰提斯","泽塔","摩沃斯","伊里康","塔沃克","维瑞克斯",
    "泽诺尼斯","塔尔沃利亚","瓦托5","菲拉西斯","瑟瑞昂","德拉卡瑞斯","维尔克罗斯",
    "卡利克斯3","沃达拉","艾斯提拉","米兰达斯","泽卡9","普罗米拉","维索拉",
    "泰拉隆","扎罗斯","派洛斯","厄里索斯","奈多尔","瓦尔特雷克斯","泽拉伦",
    "塞里斯","维拉瑞斯","德拉克斯","佐瓦拉","奎隆","丽桑德拉","维瑞西亚",
    "特尔玛拉","格瑞松","佐拉里斯","伏尔托瑞斯","奈克萨拉","奥罗拉站",
    "斯特拉拉","月神星","索拉拉","奈布隆","塞莱斯廷","奥瑞尼斯","伊克利普斯",
    "阿克图鲁斯","贝拉特里克斯","卡佩拉","迪奈布","埃尔纳特","佛马浩特",
    "伽克鲁斯","哈达尔","伊扎尔","贾巴","考斯","莱萨斯","马尔菲克",
    "奈卡尔","奥菲利亚","普罗西昂","瑞吉尔","天狼星","苏班","维加",
    "瓦萨特","扎尼亚","阿尔吉尼","巴腾","库尔萨","迪夫达","艾达西",
    "弗鲁德","戈梅萨","霍玛姆","伊克利尔","吉","克拉兹","林克斯",
    "马尔卡布","纳维","奥瑞恩","孔雀星","拉纳","萨比克","塔尼亚",
    "赤霄","苍峦","星渊","雷泽","霜落","炎煌","风歌","云涛",
    "玄冰","碧穹","银砂","紫电","青岚","赤霞","幽泉","明光",
    "碎星","流光","沉舟","飞虹","定海","镇岳","凌霄","星枢",
    "太微","紫薇","天市","北辰","扶摇","若木","建木","归墟",
    "不周","昆仑","蓬莱","方丈","瀛洲","岱舆","员峤"
];

// ==================== 全局状态 ====================
let canvas,ctx;
let planets = [];
let links = [];
let blockedLinks = new Set();
let playerCampKey = "EARTH";
let difficulty = "normal";
let turn = 1;
let selectedPlanet = null;
let selectedWeapon = null;
let deployMode = null;
let weapons = [];
let statKills = 0;

let turnDom,selDom,weaponDom,selPlanetNameDom;
let resultModal;
let sendRatioSelect, difficultySelect;
let buildWeaponBtn, moveWeaponBtn, tipsPanel;

window.onload = init;
window.addEventListener("resize",resizeCanvas);

function init(){
    canvas = document.getElementById("starCanvas");
    ctx = canvas.getContext("2d");
    turnDom = document.getElementById("turnNum");
    selDom = document.getElementById("selText");
    selPlanetNameDom = document.getElementById("selPlanetName");
    weaponDom = document.getElementById("weaponStatus");
    resultModal = document.getElementById("resultModal");
    sendRatioSelect = document.getElementById("sendRatioSelect");
    difficultySelect = document.getElementById("difficultySelect");
    buildWeaponBtn = document.getElementById("buildWeaponBtn");
    moveWeaponBtn = document.getElementById("moveWeaponBtn");
    tipsPanel = document.getElementById("tipsPanel");

    buildWeaponBtn.onclick = onBuildWeapon;
    moveWeaponBtn.onclick = onMoveWeapon;
    document.getElementById("buildFIN").onclick = activateFinal;
    document.getElementById("nextTurnBtn").onclick = nextTurn;
    canvas.onclick = canvasClick;

    resizeCanvas();
    restartGame();
    updateTips();
}

function resizeCanvas(){
    canvas.width = window.innerWidth - 340;
    canvas.height = window.innerHeight;
    if(planets.length>0) render();
}

function restartGame(){
    playerCampKey = document.getElementById("campSelect").value;
    difficulty = difficultySelect.value;
    turn = 1;
    selectedPlanet = null;
    selectedWeapon = null;
    deployMode = null;
    statKills = 0;
    blockedLinks.clear();
    planets = [];
    links = [];
    weapons = [];

    turnDom.textContent = turn;
    selDom.textContent = "无";
    selPlanetNameDom.textContent = "-";
    updateWeaponStatusUI();
    resultModal.style.display = "none";
    sendRatioSelect.value = "0.5";
    moveWeaponBtn.disabled = true;

    generateGalaxy();
    updateTips();
    render();
}

function getDifficultyParams(){
    switch(difficulty){
        case 'easy': return { neutMin:4, neutMax:14, aiThreshold:20, aiExtraGrowth:false };
        case 'hard': return { neutMin:12, neutMax:38, aiThreshold:5, aiExtraGrowth:true };
        default: return { neutMin:6, neutMax:22, aiThreshold:10, aiExtraGrowth:false };
    }
}

function generateGalaxy(){
    const W = canvas.width;
    const H = canvas.height;
    const pad = CONFIG.canvasPad;
    const homePos = [
        {x:pad, y:pad},
        {x:W-pad, y:pad},
        {x:pad, y:H-pad},
        {x:W-pad, y:H-pad}
    ];

    CAMP_KEYS.forEach((ck,idx)=>{
        const camp = CAMPS[ck];
        planets.push({
            x:homePos[idx].x, y:homePos[idx].y,
            camp:ck, isHome:true, troop:CONFIG.homeInitTroop,
            planetName:camp.homeName,
            uid: Math.random().toString(36).slice(2,10),
            resource: false
        });
    });

    const diff = getDifficultyParams();
    let namePool = [...PLANET_NAME_LIST].sort(()=>Math.random()-0.5);
    const totalNormal = CONFIG.planetTotal - 4;

    // 随机选择资源星球索引
    const resourceIndices = new Set();
    while(resourceIndices.size < CONFIG.resourceCount){
        resourceIndices.add(Math.floor(Math.random() * totalNormal));
    }

    for(let i=0;i<totalNormal;i++){
        let x,y;
        do{
            x = pad + Math.random()*(W-pad*2);
            y = pad + Math.random()*(H-pad*2);
        }while(planets.some(p=>Math.hypot(p.x-x,p.y-y)<40));

        const initT = Math.floor(Math.random()*(diff.neutMax-diff.neutMin)) + diff.neutMin;
        let pname = namePool.length>0 ? namePool.shift() : "星球"+i;
        planets.push({
            x,y, camp:null, isHome:false, troop:initT,
            planetName:pname,
            uid: Math.random().toString(36).slice(2,10),
            resource: resourceIndices.has(i)
        });
    }
    buildConnections();
}

function buildConnections(){
    links = [];
    planets.forEach(p=>{
        const others = planets.filter(o=>o.uid!==p.uid)
            .sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))
            .slice(0,5);
        others.forEach(t=>{
            const idPair = [p.uid,t.uid].sort().join("_");
            if(!links.some(l=>l.idPair===idPair)){
                links.push({a:p,b:t,idPair});
            }
        });
    });
}

// ==================== 渲染 ====================
function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // 航道
    links.forEach(ln=>{
        const isBlock = blockedLinks.has(ln.idPair);
        ctx.beginPath();
        ctx.moveTo(ln.a.x,ln.a.y);
        ctx.lineTo(ln.b.x,ln.b.y);
        ctx.strokeStyle = isBlock ? "#772222":"#283060";
        ctx.lineWidth = isBlock ? 2:1;
        ctx.stroke();
    });
    // 星球
    planets.forEach(p=>{
        const r = p.isHome?16:10;
        const campData = p.camp?CAMPS[p.camp]:null;
        // 选中高亮
        if(selectedPlanet && selectedPlanet.uid===p.uid){
            ctx.beginPath();
            ctx.arc(p.x,p.y,r+5,0,Math.PI*2);
            ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.stroke();
        }
        // 星球本体
        ctx.beginPath();
        ctx.arc(p.x,p.y,r,0,Math.PI*2);
        ctx.fillStyle = campData?campData.color:"#505050";
        ctx.fill();
        if(p.isHome){
            ctx.beginPath();
            ctx.arc(p.x,p.y,r+3,0,Math.PI*2);
            ctx.strokeStyle="#ffdd00"; ctx.lineWidth=2; ctx.stroke();
        }
        // 资源标记
        if(p.resource){
            ctx.fillStyle="#ffaa00";
            ctx.font="12px Arial";
            ctx.fillText("◆", p.x, p.y-r-2);
        }
        // 兵力数字
        ctx.fillStyle="#fff";
        ctx.font="bold 11px Arial";
        ctx.textAlign="center";
        ctx.fillText(p.troop, p.x, p.y+r+13);
        // 星球名称
        ctx.fillStyle="#aaa";
        ctx.font="8px Microsoft Yahei";
        ctx.fillText(p.planetName, p.x, p.y+r+22);
        // 武器图标
        const planetWeapons = weapons.filter(w=>w.planetId===p.uid);
        if(planetWeapons.length>0){
            let yOff = p.y - r - 8;
            planetWeapons.forEach(w=>{
                ctx.fillStyle = w.camp===playerCampKey ? "#ffd700":"#ff4444";
                ctx.font="16px Arial";
                ctx.fillText(w.type==='mobile'?'◈':'⬢', p.x, yOff);
                yOff -= 16;
            });
        }
    });

    if(deployMode){
        ctx.strokeStyle = "#00ff00";
        ctx.lineWidth = 1;
        planets.forEach(p=>{
            if(p.uid !== deployMode.fromPlanet.uid){
                ctx.beginPath();
                ctx.arc(p.x,p.y,18,0,Math.PI*2);
                ctx.stroke();
            }
        });
    }
}

// ==================== 武器系统 ====================
function getCampWeaponDef(){
    return CAMPS[playerCampKey];
}

function updateWeaponStatusUI(){
    const camp = getCampWeaponDef();
    const myWeapons = weapons.filter(w=>w.camp===playerCampKey);
    if(myWeapons.length===0){
        weaponDom.textContent = "武器状态：无";
    }else{
        if(camp.weaponType==='mobile'){
            const w = myWeapons[0];
            const planet = planets.find(p=>p.uid===w.planetId);
            weaponDom.textContent = `${camp.lwName}：已建造 (位于${planet?planet.planetName:'?'})`;
        }else{
            weaponDom.textContent = `${camp.lwName}：已部署${myWeapons.length}个`;
        }
    }
    moveWeaponBtn.disabled = (camp.weaponType!=='mobile' || selectedWeapon===null);
}

function updateTips(){
    const camp = getCampWeaponDef();
    let tip = `【${camp.name}军备】\n`;
    tip += `大型武器：${camp.lwName}（${camp.weaponType==='mobile'?'移动型·一次性建造':'部署型·可多次部署'}）\n`;
    tip += `终结手段：${camp.finName}\n`;
    if(camp.weaponType==='mobile'){
        tip += `建造消耗${CONFIG.buildMoveCost}兵力，提供保卫+${camp.guardBonus}、削弱${camp.weaken}\n移动：选中武器(图标◈)再点己方星球`;
    }else{
        tip += `每次部署消耗${CONFIG.deployCost}兵力，可在任意星球部署\n己方星球：保卫+${camp.guardBonus}\n敌方/中立：每回合损兵${camp.decay}，战斗削弱${camp.weaken}`;
    }
    tip += `\n◆ 资源星球：每回合额外+2兵力`;
    tipsPanel.textContent = tip;
}

function onBuildWeapon(){
    const camp = getCampWeaponDef();
    if(camp.weaponType==='mobile'){
        const existMobile = weapons.some(w=>w.camp===playerCampKey && w.type==='mobile');
        if(existMobile){
            alert(`${camp.lwName}已建造，不可重复建造！`);
            return;
        }
        if(!selectedPlanet || selectedPlanet.camp !== playerCampKey){
            alert("请先选中一个己方星球作为建造基地！");
            return;
        }
        if(selectedPlanet.troop < CONFIG.buildMoveCost){
            alert(`兵力不足，需要${CONFIG.buildMoveCost}兵力`);
            return;
        }
        selectedPlanet.troop -= CONFIG.buildMoveCost;
        weapons.push({
            id: Math.random().toString(36).slice(2,8),
            camp: playerCampKey,
            type: 'mobile',
            planetId: selectedPlanet.uid,
            guardBonus: camp.guardBonus,
            weaken: camp.weaken,
            decay: 0
        });
        alert(`${camp.lwName}建造成功！`);
    }else{
        if(!selectedPlanet || selectedPlanet.camp !== playerCampKey){
            alert("请先选中一个己方星球支付部署费用！");
            return;
        }
        if(selectedPlanet.troop < CONFIG.deployCost){
            alert(`兵力不足，需要${CONFIG.deployCost}兵力`);
            return;
        }
        deployMode = { fromPlanet: selectedPlanet };
        selectedPlanet = null;
        selDom.textContent = "选择目标星球...";
        selPlanetNameDom.textContent = "-";
        render();
        return;
    }
    updateWeaponStatusUI();
    render();
}

function onMoveWeapon(){
    if(!selectedWeapon || selectedWeapon.type!=='mobile') return;
    if(!selectedPlanet || selectedPlanet.camp !== playerCampKey){
        alert("请先选中一个己方星球作为移动目标！");
        return;
    }
    selectedWeapon.planetId = selectedPlanet.uid;
    alert(`${CAMPS[playerCampKey].lwName}已移动到${selectedPlanet.planetName}`);
    selectedWeapon = null;
    selectedPlanet = null;
    updateWeaponStatusUI();
    moveWeaponBtn.disabled = true;
    render();
}

// 精准检测武器点击
function findWeaponAtPos(mx, my){
    for(let w of weapons){
        const planet = planets.find(p=>p.uid===w.planetId);
        if(!planet) continue;
        const r = planet.isHome?16:10;
        const planetWeapons = weapons.filter(wp=>wp.planetId===planet.uid);
        const index = planetWeapons.indexOf(w);
        if(index === -1) continue;
        // 计算y中心（与渲染一致）
        const yCenter = planet.y - r - 8 - 16*index - 8;  // 图标16px，向上偏移
        const rect = { x: planet.x-8, y: yCenter-8, w: 16, h: 16 };
        if(mx >= rect.x && mx <= rect.x+rect.w && my >= rect.y && my <= rect.y+rect.h){
            return w;
        }
    }
    return null;
}

// ==================== 鼠标交互 ====================
function canvasClick(evt){
    const rect = canvas.getBoundingClientRect();
    const mx = evt.clientX - rect.left;
    const my = evt.clientY - rect.top;

    // 部署模式优先
    if(deployMode){
        const hit = planets.find(p=>Math.hypot(p.x-mx,p.y-my)<20);
        if(!hit || hit.uid === deployMode.fromPlanet.uid){
            alert("请选择目标星球（不能是自己）");
            return;
        }
        const from = deployMode.fromPlanet;
        from.troop -= CONFIG.deployCost;
        const camp = getCampWeaponDef();
        weapons.push({
            id: Math.random().toString(36).slice(2,8),
            camp: playerCampKey,
            type: 'deploy',
            planetId: hit.uid,
            guardBonus: camp.guardBonus,
            weaken: camp.weaken,
            decay: camp.decay || 0
        });
        alert(`${camp.lwName}已部署到${hit.planetName}`);
        deployMode = null;
        updateWeaponStatusUI();
        render();
        return;
    }

    // 精确检测武器点击（优先级高于星球）
    const clickedWeapon = findWeaponAtPos(mx, my);
    if(clickedWeapon && clickedWeapon.camp === playerCampKey){
        selectedWeapon = clickedWeapon;
        selectedPlanet = null;
        const planet = planets.find(p=>p.uid===clickedWeapon.planetId);
        selDom.textContent = `武器：${CAMPS[playerCampKey].lwName}`;
        selPlanetNameDom.textContent = planet ? planet.planetName : '-';
        moveWeaponBtn.disabled = (clickedWeapon.type!=='mobile');
        render();
        return;
    }

    const hitPlanet = planets.find(p=>Math.hypot(p.x-mx,p.y-my)<20);
    if(!hitPlanet){
        selectedPlanet = null;
        selectedWeapon = null;
        selDom.textContent = "无";
        selPlanetNameDom.textContent = "-";
        moveWeaponBtn.disabled = true;
        render(); return;
    }

    // 如果已选中武器且点击星球，尝试移动
    if(selectedWeapon){
        if(selectedWeapon.type==='mobile' && hitPlanet.camp===playerCampKey){
            selectedWeapon.planetId = hitPlanet.uid;
            alert(`武器已移动到${hitPlanet.planetName}`);
            selectedWeapon = null;
            selectedPlanet = null;
            updateWeaponStatusUI();
            moveWeaponBtn.disabled = true;
            render();
        }else{
            alert("只能将移动型武器移动到己方星球！");
            selectedWeapon = null;
            moveWeaponBtn.disabled = true;
        }
        return;
    }

    // 正常星球交互
    if(selectedPlanet){
        if(selectedPlanet.uid === hitPlanet.uid){
            selectedPlanet = null;
            selDom.textContent = "无";
            selPlanetNameDom.textContent = "-";
            render(); return;
        }
        const linkCheck = links.find(l=>
            (l.a.uid===selectedPlanet.uid&&l.b.uid===hitPlanet.uid)||
            (l.b.uid===selectedPlanet.uid&&l.a.uid===hitPlanet.uid)
        );
        if(!linkCheck){ alert("只能进攻或调兵到相邻星球！"); selectedPlanet=hitPlanet; }
        else if(blockedLinks.has(linkCheck.idPair)){ alert("航道被封锁！"); selectedPlanet=hitPlanet; }
        else if(selectedPlanet.camp===playerCampKey && hitPlanet.camp===playerCampKey){
            moveTroops(selectedPlanet, hitPlanet);
            selectedPlanet = null;
        }
        else if(selectedPlanet.camp===playerCampKey){
            if(selectedPlanet.troop<=0){ alert("星球没有兵力！"); selectedPlanet=hitPlanet; }
            else{ executeAttack(selectedPlanet,hitPlanet); selectedPlanet=null; }
        }
        else{ alert("请先选中己方星球！"); selectedPlanet=hitPlanet; }
    }else{
        selectedPlanet = hitPlanet;
    }
    selDom.textContent = hitPlanet.camp ? CAMPS[hitPlanet.camp].name:"中立星球";
    selPlanetNameDom.textContent = hitPlanet.planetName;
    moveWeaponBtn.disabled = true;
    render();
}

function moveTroops(from, to){
    const ratio = getSendRatio();
    const sendTroop = Math.floor(from.troop * ratio);
    if(sendTroop <= 0){ alert("兵力不足，无法调遣"); return; }
    from.troop -= sendTroop;
    to.troop += sendTroop;
}

function executeAttack(from,to){
    const ratio = getSendRatio();
    let attackTroop = Math.floor(from.troop * ratio);
    from.troop -= attackTroop;

    const targetWeapons = weapons.filter(w=>w.planetId===to.uid);
    let guardBonus = 0, weakenEffect = 0;
    targetWeapons.forEach(w=>{
        if(w.type==='deploy'){
            if(to.camp === w.camp) guardBonus += w.guardBonus;
            else weakenEffect += w.weaken;
        }else if(w.type==='mobile'){
            if(to.camp === w.camp){ guardBonus += w.guardBonus; weakenEffect += w.weaken; }
        }
    });

    let defendTroop = to.troop + guardBonus;
    let effectiveAttack = Math.max(0, attackTroop - weakenEffect);
    const result = effectiveAttack - defendTroop;

    if(result > 0){
        statKills += to.troop;
        to.camp = from.camp;
        to.troop = result;
        weapons = weapons.filter(w=>!(w.planetId===to.uid && w.camp!==to.camp));
        checkConquestWin();
    }else{
        statKills += Math.min(attackTroop, to.troop);
        to.troop = Math.max(1, to.troop - attackTroop);
    }
}

function checkConquestWin(){
    const enemyHomes = planets.filter(p=>p.isHome && p.camp && p.camp!==playerCampKey);
    if(enemyHomes.length === 0) endGame("conquest");
}

function nextTurn(){
    // 部署型武器衰减
    weapons.forEach(w=>{
        if(w.type==='deploy' && w.decay>0){
            const planet = planets.find(p=>p.uid===w.planetId);
            if(planet && planet.camp !== w.camp){
                planet.troop = Math.max(1, planet.troop - w.decay);
            }
        }
    });

    const diff = getDifficultyParams();
    // AI行动
    planets.forEach(p=>{
        if(p.camp && p.camp !== playerCampKey){
            aiAction(p, diff.aiThreshold);
        }
    });

    // 玩家增长（含资源星球额外）
    planets.forEach(p=>{
        if(p.camp === playerCampKey){
            p.troop += 1;
            if(p.resource) p.troop += 2;
        }
    });

    // 困难模式敌方额外增长
    if(diff.aiExtraGrowth){
        planets.forEach(p=>{
            if(p.camp && p.camp !== playerCampKey) p.troop += 1;
        });
    }

    turn++;
    turnDom.textContent = turn;
    selectedPlanet = null;
    selectedWeapon = null;
    deployMode = null;
    selDom.textContent = "无";
    selPlanetNameDom.textContent = "-";
    moveWeaponBtn.disabled = true;
    updateWeaponStatusUI();
    render();
}

// AI进攻优化：选择兵力最低的相邻目标
function aiAction(ownPlanet, threshold){
    if(ownPlanet.troop < threshold) return;
    let targets = [];
    links.forEach(ln=>{
        if(ln.a.uid===ownPlanet.uid && ln.b.camp!==ownPlanet.camp && !blockedLinks.has(ln.idPair))
            targets.push(ln.b);
        else if(ln.b.uid===ownPlanet.uid && ln.a.camp!==ownPlanet.camp && !blockedLinks.has(ln.idPair))
            targets.push(ln.a);
    });
    if(targets.length===0) return;
    // 优先攻击兵力最低的相邻星球
    targets.sort((a,b)=>a.troop - b.troop);
    const target = targets[0];
    const send = Math.floor(ownPlanet.troop * 0.7);
    ownPlanet.troop -= send;

    const targetWeapons = weapons.filter(w=>w.planetId===target.uid);
    let guardBonus=0, weaken=0;
    targetWeapons.forEach(w=>{
        if(w.type==='deploy'){
            if(target.camp === w.camp) guardBonus+=w.guardBonus;
            else weaken+=w.weaken;
        }else if(w.type==='mobile'){
            if(target.camp===w.camp){ guardBonus+=w.guardBonus; weaken+=w.weaken; }
        }
    });
    let effectiveAttack = Math.max(0, send - weaken);
    const defendTroop = target.troop + guardBonus;
    const res = effectiveAttack - defendTroop;
    if(res > 0){
        target.camp = ownPlanet.camp;
        target.troop = res;
        weapons = weapons.filter(w=>!(w.planetId===target.uid && w.camp!==target.camp));
        checkConquestWin();
    }else{
        target.troop = Math.max(1, target.troop - send);
    }
}

function getSendRatio(){ return parseFloat(sendRatioSelect.value||"0.5"); }

function activateFinal(){
    const camp = getCampWeaponDef();
    const hasWeapon = weapons.some(w=>w.camp===playerCampKey);
    if(!hasWeapon){
        alert(`必须先建造/部署${camp.lwName}！`);
        return;
    }
    if(!selectedPlanet || selectedPlanet.camp !== playerCampKey){
        alert("选中己方星球启动终结手段！");
        return;
    }
    if(selectedPlanet.troop < CONFIG.finalCost){
        alert(`需要${CONFIG.finalCost}兵力`);
        return;
    }
    selectedPlanet.troop -= CONFIG.finalCost;
    endGame("deterrence");
}

function endGame(victoryType){
    const playerOwned = planets.filter(p=>p.camp===playerCampKey).length;
    let scoreRaw = Math.round(playerOwned*9 + statKills*0.22 + turn*2);
    document.getElementById("winTitle").innerText = victoryType==="conquest"?"征服胜利":"威慑胜利";
    document.getElementById("resultType").innerText =
        victoryType==="conquest"?"占领全部敌方母星，统一星图！":"启动终极武器强制停战";
    document.getElementById("statPlanet").innerText = playerOwned;
    document.getElementById("statKills").innerText = statKills;
    document.getElementById("statTurn").innerText = turn;
    document.getElementById("finalScore").innerText = scoreRaw;
    resultModal.style.display = "flex";
}
function closeModal(){ resultModal.style.display = "none"; }
</script>
