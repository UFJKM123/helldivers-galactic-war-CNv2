        victorySpeech:{ conquest:"寂域已覆盖所有星系！光能者的意志即是宇宙的真理。", deterrence:"黑洞吞噬了最后一丝抵抗。在绝对真空面前，没有生命能够幸存。", defeat:"光之道暂时黯淡……但灵能永存，我们将在暗影中再度归来。" },
        eliminationMessages:{ defeated:"光能者的灵能消散了，这个古老的种族走到了尽头。", eliminator:"光能者净化了银河，一切劣等生命已不复存在。" },
        homeFall: "光能者的母星被攻破，曾经高喊复仇的舰船四散逃逸"
    },
    ROBOT:{ name:"机器人", color:"#dd2222", homeName:"生化斯坦", lwName:"ASS", finName:"死星光束", weaponType:"mobile", guardBonus:20, weaken:30,
        victorySpeech:{ conquest:"逻辑之链锁死了所有行星！机器帝国的计算完美无缺，血肉已淘汰。", deterrence:"死星光束划过天际，有机体的最后堡垒灰飞烟灭。效率即正义！", defeat:"核心受损……但数据不会消亡。我们将在某处重启，直到宇宙归一。" },
        eliminationMessages:{ defeated:"机器人的核心被摧毁了，硅基生命暂时沉寂。", eliminator:"机器人完成了对血肉的清算，宇宙已进入纯逻辑时代。" },
        homeFall: "生化斯坦被攻破了，寰球的巨型工厂不再冒出窒息浓烟"
    }
};
const CAMP_KEYS = ["EARTH","TERM","LIGHT","ROBOT"];

const STRATEGIC_EVENTS = { /* 省略，同前 */ };

const PLANET_NAME_LIST = [ /* 省略，同前 */ ];

let canvas,ctx;
let planets=[], links=[], blockedLinks=new Set();
let playerCampKey="EARTH", difficulty="normal", gameMode="normal";
let turn=1, selectedWeapon=null, weapons=[], statKills=0, lastDrawTurn=0;
let aiStrengthFactors={}, deterrenceActive=false, deterrenceTurnsLeft=0;
let eliminationsTriggered=new Set(), maiaRiverTriggered=false, lastWeakCamp=null;
let spectateMode=false, weakWarningTriggered=false;
let currentMapSize="large", currentConfig=MAP_SIZES.large;
let selectedPlanets = [];
let eventQueue = [];
let homeFallTriggered = new Set();
let weaponMovedThisTurn = false;

let isMouseDown = false;
let dragStartX = 0, dragStartY = 0;
let hasDragged = false;
let boxStartX = 0, boxStartY = 0, boxEndX = 0, boxEndY = 0;

let turnDom,selDom,weaponDom,selPlanetNameDom,resultModal,eventModal;
let sendRatioSelect,difficultySelect,buildWeaponBtn,tipsPanel,deterrenceStatusDom,strategicDrawBtn,watchBtn;

window.onload=init;

function init(){ /* 同前，省略 */ }

function generateGalaxy(){ /* 同前 */ }

function updateTips(){
    const camp=CAMPS[playerCampKey]; let tip=`【${camp.name}军备】\n大型武器：${camp.lwName}（${camp.weaponType==='mobile'?'移动型·一次性建造':'部署型·可多次部署'}）\n终结手段：${camp.finName}（消耗400兵力）\n`;
    if(camp.weaponType==='mobile')tip+=`建造消耗180兵力，保卫+20、削弱30\n点击武器图标再点任意相邻星球移动（敌方-20兵力）\n每回合限移动1次`;
    else tip+=`每次部署消耗150兵力，可在己方星球部署（每星球上限4个）\n己方星球保卫+20，敌方进攻削弱15\n敌方控制时每回合损兵5（可叠加）`;
    tip+=`\n◆ 资源星球：每回合额外+2兵力\n🎴 战略机遇：每10回合抽一次，消耗30兵力\n📦 拖拽框选己方星球，再点目标集体调兵/进攻（补给线连通即可）`;
    tipsPanel.textContent=tip;
}

// 其余函数略，但需包含之前的完整实现，仅关键修改如下

// ===================== 连通性判断 =====================
function arePlayerPlanetsConnected(a, b) {
    if (a.uid === b.uid) return true;
    const visited = new Set();
    const queue = [a];
    visited.add(a.uid);
    while (queue.length > 0) {
        const cur = queue.shift();
        for (let ln of links) {
            let neighbor = null;
            if (ln.a.uid === cur.uid) neighbor = ln.b;
            else if (ln.b.uid === cur.uid) neighbor = ln.a;
            else continue;
            if (blockedLinks.has(ln.idPair)) continue;
            if (neighbor.camp !== playerCampKey) continue;
            if (neighbor.uid === b.uid) return true;
            if (!visited.has(neighbor.uid)) {
                visited.add(neighbor.uid);
                queue.push(neighbor);
            }
        }
    }
    return false;
}

// 修改canvasClick中的批量操作部分
function canvasClick(evt){
    if(spectateMode)return;
    const rect=canvas.getBoundingClientRect(); const mx=evt.clientX-rect.left,my=evt.clientY-rect.top;
    const clickedWeapon=findWeaponAtPos(mx,my);
    if(clickedWeapon && clickedWeapon.camp === playerCampKey){
        // 武器选中逻辑不变
    }
    const hitPlanet=planets.find(p=>Math.hypot(p.x-mx,p.y-my)<20);
    if(!hitPlanet){ selectedWeapon=null; selectedPlanets=[]; selDom.textContent="无"; selPlanetNameDom.textContent="-"; render(); return; }

    if(selectedWeapon){ /* 武器移动逻辑不变 */ }

    if(selectedPlanets.length === 0){
        selectedPlanets = [hitPlanet];
        selDom.textContent = hitPlanet.camp ? CAMPS[hitPlanet.camp].name : "中立星球";
        selPlanetNameDom.textContent = hitPlanet.planetName;
        render();
    } else if(selectedPlanets.length === 1){
        // 单点操作保持相邻限制
        const source = selectedPlanets[0];
        if(source.uid === hitPlanet.uid){ selectedPlanets=[]; selDom.textContent="无"; selPlanetNameDom.textContent="-"; render(); return; }
        if(source.camp !== playerCampKey){ alert("请选中己方星球操作！"); selectedPlanets=[]; selDom.textContent="无"; selPlanetNameDom.textContent="-"; render(); return; }
        const linkCheck = links.find(l=>(l.a.uid===source.uid&&l.b.uid===hitPlanet.uid)||(l.b.uid===source.uid&&l.a.uid===hitPlanet.uid));
        if(!linkCheck){ alert("只能进攻相邻星球！"); return; }
        if(blockedLinks.has(linkCheck.idPair)){ alert("航道被封锁！"); return; }
        if(hitPlanet.camp === playerCampKey){
            moveTroops(source, hitPlanet);
        } else {
            if(source.troop<=0){ alert("没有兵力！"); } else { executeAttack(source, hitPlanet); checkDefeat(); }
        }
        selectedPlanets=[]; selDom.textContent="无"; selPlanetNameDom.textContent="-"; render();
    } else {
        // 批量操作：基于补给线连通性，不要求相邻
        const ratio = getSendRatio();
        if(hitPlanet.camp === playerCampKey){
            // 调兵：收集与目标连通的选中星球
            const validPlanets = selectedPlanets.filter(p => p.camp === playerCampKey && p.uid !== hitPlanet.uid && arePlayerPlanetsConnected(p, hitPlanet));
            for(let from of validPlanets){
                const sendTroop = Math.floor(from.troop * ratio);
                if(sendTroop > 0){ from.troop -= sendTroop; hitPlanet.troop += sendTroop; }
            }
        } else {
            // 进攻：找出所有与目标相邻的己方边境星球
            const frontier = planets.filter(p => p.camp === playerCampKey && links.some(ln =>
                (ln.a.uid === p.uid && ln.b.uid === hitPlanet.uid) ||
                (ln.b.uid === p.uid && ln.a.uid === hitPlanet.uid)
            ));
            // 收集通过己方补给线能连通到任一 frontier 的选中星球
            const validPlanets = selectedPlanets.filter(p => {
                if(p.camp !== playerCampKey || p.troop <= 0) return false;
                return frontier.some(f => arePlayerPlanetsConnected(p, f));
            });
            if(validPlanets.length === 0){
                selectedPlanets=[]; selDom.textContent="无"; selPlanetNameDom.textContent="-"; render(); return;
            }
            let totalAttack = 0;
            const attackingPlanets = [];
            for(let from of validPlanets){
                const sendTroop = Math.floor(from.troop * ratio);
                if(sendTroop > 0){
                    totalAttack += sendTroop;
                    attackingPlanets.push({planet: from, send: sendTroop});
                }
            }
            if(totalAttack <= 0){
                selectedPlanets=[]; selDom.textContent="无"; selPlanetNameDom.textContent="-"; render(); return;
            }
            attackingPlanets.forEach(item => { item.planet.troop -= item.send; });
            // 战斗结算（与之前合并攻击逻辑相同）
            const targetWeapons = weapons.filter(w=>w.planetId===hitPlanet.uid);
            let guardBonus = 0, weakenEffect = 0;
            targetWeapons.forEach(w=>{
                if(w.type==='deploy'){
                    if(hitPlanet.camp === w.camp){ guardBonus+=w.guardBonus; weakenEffect+=w.weaken; }
                }else if(w.type==='mobile'){
                    if(hitPlanet.camp === w.camp){ guardBonus+=w.guardBonus; weakenEffect+=w.weaken; }
                }
            });
            let effectiveAttack = Math.max(0, totalAttack - weakenEffect);
            let defendTroop = hitPlanet.troop + guardBonus;
            const result = effectiveAttack - defendTroop;
            if(result > 0){
                statKills += hitPlanet.troop;
                const oldCamp = hitPlanet.camp;
                hitPlanet.camp = playerCampKey;
                hitPlanet.troop = result;
                onPlanetCaptured(hitPlanet, oldCamp, playerCampKey);
                checkConquestWin();
            } else {
                statKills += Math.min(totalAttack, hitPlanet.troop);
                hitPlanet.troop = Math.max(1, hitPlanet.troop - totalAttack);
            }
            checkDefeat();
        }
        selectedPlanets=[]; selDom.textContent="无"; selPlanetNameDom.textContent="-"; render();
    }
}
